<script>
'use strict';
const EMIRATES=['Dubai','Abu Dhabi','Sharjah','Ajman','Umm Al Quwain','Ras Al Khaimah','Fujairah'];
const SPORTS=[{id:'football',name:'Football',symbol:'⚽'},{id:'cricket',name:'Cricket',symbol:'🏏'},{id:'basketball',name:'Basketball',symbol:'🏀'},{id:'badminton',name:'Badminton',symbol:'🏸'},{id:'tennis',name:'Tennis',symbol:'🎾'},{id:'swimming',name:'Swimming',symbol:'🏊'}];
const CATEGORIES={training:{name:'Training',summary:'Find coaching, lessons, and sports academies.',label:'Coaching & lessons'},play:{name:'Play & Clubs',summary:'Find clubs, casual games, and groups to play with.',label:'Games & communities'}};
const AREAS={'Dubai':['Al Barsha','Mirdif','Jumeirah'],'Abu Dhabi':['Khalifa City','Al Reem Island','Al Bateen'],'Sharjah':['Al Nahda','Al Majaz','Muwaileh'],'Ajman':['Al Jurf','Al Rashidiya','Al Nuaimiya'],'Umm Al Quwain':['Al Salamah','Al Rass','Al Hamra'],'Ras Al Khaimah':['Al Hamra','Al Nakheel','Mina Al Arab'],'Fujairah':['Al Faseel','Dibba','Al Ghurfa']};

const SKILL_LABELS={beginner:'Beginner',intermediate:'Intermediate',advanced:'Advanced',all:'All levels'};
const SEEDS={
 football:{training:['First Touch','Pitchcraft'],play:['Kickabout Collective','Floodlight Football'],description:['Build confidence with passing, footwork and small-sided drills.','Meet other players for friendly matches and relaxed team play.'],equipment:['Footballs, cones and training bibs','Football boots or trainers, shin guards and water'],base:35},

 basketball:{training:['Hoop Skills','Baseline Academy'],play:['Open Court Crew','Sunset Hoops'],description:['Develop your dribble, shooting technique and court awareness.','Enjoy welcoming pickup games with balanced teams and shared court time.'],equipment:['Basketballs, cones and bibs','Non-marking court shoes and water'],base:25},
 badminton:{training:['Shuttle Steps','Rallycraft'],play:['Shuttle Social','Evening Rally Club'],description:['Learn footwork, serve technique and confident racket control.','Find a doubles partner and enjoy sociable, rotating court games.'],equipment:['Loan rackets, shuttlecocks and nets','Non-marking indoor shoes and water'],base:20},

// Every record has a stable ID and the same schema; all records below are fictional.
const LISTINGS=EMIRATES.flatMap((emirate,e)=>SPORTS.flatMap((sport,s)=>Object.keys(CATEGORIES).flatMap(category=>[0,1,2].map(v=>{
 const seed=SEEDS[sport.id];
 const ages=v===0?['children','teenagers']:v===1?['adults','seniors']:['teenagers','adults'];
 const skill=v===0?'beginner':v===1?'all':(s%2?'intermediate':'advanced');
 const group=v===0?'Junior':v===1?'Community':'Performance';
 const name=seed[category][v===2?1:v]+' '+group;
 const price=seed.base+(category==='training'?15:0)+v*15+(e%3)*5;
 return {id:`${category}-${sport.id}-${e}-${v}`,name,emirate,area:AREAS[emirate][v],sport:sport.id,category,ages,skill,price,
  description:seed.description[category==='training'?0:1],duration:sport.id==='swimming'?45:60,
  includes:category==='training'?'Small-group coaching, venue access and shared practice equipment.':'One organised group session, venue access and shared equipment.',
  schedule:v===0?'Tuesday & Thursday · 16:30':v===1?'Saturday & Sunday · 08:00':'Monday & Wednesday · 19:00',
  provided:seed.equipment[0],bring:seed.equipment[1],trial:category==='training'&&v!==2,
  extra:sport.id==='swimming'&&category==='play'?'Participants must be able to swim 25 metres independently. This is a social swim, with a sample lifeguard-supervised setting.':v===0?'Children and teenagers attend separate age-matched groups. A parent or guardian should accompany children.':'Groups are organised by pace and experience; everyone is encouraged to take breaks as needed.'};
}))));

// Reference-aligned fictional football sessions in Dubai.
AREAS.Dubai.push('Al Quoz');
LISTINGS.filter(l=>l.emirate==='Dubai'&&l.category==='training'&&l.sport==='football').forEach((l,i)=>{l.name=['Palm Court Football Academy','Harbour Football Studio','Community Football Collective'][i];l.area=['Al Barsha','Al Quoz','Mirdif'][i];l.price=[45,65,80][i];});


const GLYPHS={back:'<path d="m14 5-7 7 7 7"/>',next:'<path d="M4 12h16m-7-7 7 7-7 7"/>',home:'<path d="m3 10 9-7 9 7v10H3Zm6 10v-7h6v7"/>',explore:'<circle cx="12" cy="12" r="9"/><path d="m16 8-3 5-5 3 3-5Z"/>',bookmark:'<path d="M6 3h12v18l-6-4-6 4Z"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 0 1 14 0Z"/><circle cx="12" cy="10" r="2"/>',people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-4a6 6 0 0 1 12 0v4m3-17a3 3 0 0 1 0 6m0 5a5 5 0 0 1 3 5"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',filter:'<path d="M3 7h18M3 17h18"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/>',chevron:'<path d="m9 5 7 7-7 7"/>'};
const svg=(name)=>`<svg aria-hidden="true" viewBox="0 0 24 24">${GLYPHS[name]}</svg>`;
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=(value,label,current)=>`<option value="${esc(value)}"${String(value)===String(current)?' selected':''}>${esc(label)}</option>`;
const main=document.getElementById('main'),app=document.getElementById('app');
let currentEmirate='Dubai',lastCategory='training',previousPath='',filtersExpanded=false,toastTimer;
let saved=new Set();try{const value=JSON.parse(localStorage.getItem('sportnear-saved')||'[]');if(Array.isArray(value))saved=new Set(value.filter(id=>typeof id==='string'&&LISTINGS.some(l=>l.id===id)))}catch{}
function state(){const raw=location.hash.slice(1)||'/';const [path,query='']=raw.split('?');let p;try{p=decodeURIComponent(path).split('/').filter(Boolean)}catch{p=['invalid']}return {path,p,q:new URLSearchParams(query)}}
function route(path,q=new URLSearchParams()){return '#'+path+(q.toString()?'?'+q.toString():'')}
function nav(path,q){const hash=route(path,q);if(location.hash===hash)render();else location.hash=hash}
function cityQuery(){return new URLSearchParams({emirate:currentEmirate})}
function note(text='All listings, locations and prices are illustrative. The photographs are generated illustrations, not provider images.'){return `<aside class="sample-note">${svg('info')}<p>${text}</p></aside>`}
function sportPhoto(sport,classes=''){return `<span class="photo sport-photo ${classes}" data-sport="${sport}" aria-hidden="true"></span>`}
function footballPhoto(variant){return `<span class="photo football-photo" data-variant="${variant}" aria-hidden="true"></span>`}
function heroPhoto(sport){return sport==='football'?footballPhoto('hero'):sportPhoto(sport)}
function header(back){document.getElementById('topbar').innerHTML=`${back?`<a class="back-btn" href="${back}" aria-label="Back">${svg('back')}</a>`:''}<a class="brand" href="${route('/',cityQuery())}" aria-label="SportNear home">Sport<span>Near</span></a><label class="location-pill" for="emirate">${svg('pin')}<span class="sr-only">Choose emirate</span><select id="emirate">${EMIRATES.map(e=>opt(e,e,currentEmirate)).join('')}</select></label>`}
function bottom(active){document.getElementById('bottom-nav').innerHTML=[['home','Home',route('/',cityQuery())],['explore','Explore',route('/sports/'+lastCategory,cityQuery())],['bookmark','Saved',route('/saved',cityQuery())]].map(([icon,label,url])=>`<a href="${url}"${label.toLowerCase()===active?' aria-current="page"':''}>${svg(icon)}<span>${label}</span>${label==='Saved'&&saved.size?`<span class="saved-count" aria-label="${saved.size} saved listings">${saved.size}</span>`:''}</a>`).join('')}
function home(){return `<section class="hero"><h1>Your next move<em>.</em></h1><p class="subtitle">Learn a sport. Find your people.</p></section><section class="journeys" aria-label="Choose your activity">${Object.entries(CATEGORIES).map(([key,c])=>`<a class="entry-card" href="${route('/sports/'+key,cityQuery())}" aria-label="${c.name}: ${c.summary}">${key==='training'?sportPhoto('tennis'):footballPhoto('hero')}<div class="caption"><p class="eyebrow">${key==='training'?'Build your skills':'Find your community'}</p><h2>${c.name}</h2><p>${key==='training'?'Coaching for every age and level.':'Good games. Great company.'}</p></div><span class="go" aria-hidden="true">${svg('next')}</span></a>`).join('')}</section>${note('Across the UAE · Sample listings. All venues and photographs are illustrative.')}`}
function sportTiles(category){return SPORTS.map(s=>`<a class="sport-tile" href="${route('/results/'+category+'/'+s.id,cityQuery())}" aria-label="${s.name} ${CATEGORIES[category].name}">${sportPhoto(s.id)}<div class="tile-label"><h2>${s.name}</h2><span class="go" aria-hidden="true">${svg('next')}</span></div></a>`).join('')}
function sportsPage(category){return `<section class="hero sports-hero">${sportPhoto('tennis')}<p class="eyebrow">${CATEGORIES[category].name}</p><h1>Find your sport.</h1><p class="subtitle">${category==='training'?'A new skill starts here.':'Your next game starts here.'}</p></section><section class="sports-grid" aria-label="Choose a sport">${sportTiles(category)}</section><button class="location-row glass" data-location><span class="left">${svg('pin')}${esc(currentEmirate)}, UAE</span><span class="change">Change ${svg('chevron')}</span></button><p class="helper">${category==='training'?'Coaching':'Games and groups'} for every age and level.</p>${note()}`}
function readFilters(q){return {emirate:EMIRATES.includes(q.get('emirate'))?q.get('emirate'):currentEmirate,area:q.get('area')||'',age:Object.hasOwn(AGE_LABELS,q.get('age'))?q.get('age'):'',skill:Object.hasOwn(SKILL_LABELS,q.get('skill'))?q.get('skill'):'',budget:['30','50','75','100'].includes(q.get('budget'))?q.get('budget'):'',sort:q.get('sort')==='high'?'high':'low'}}
function filtered(category,sport,q){const f=readFilters(q);return LISTINGS.filter(l=>l.category===category&&l.sport===sport&&l.emirate===f.emirate&&(!f.area||l.area===f.area)&&(!f.age||l.ages.includes(f.age))&&(!f.skill||(f.skill==='all'?l.skill==='all':l.skill===f.skill||l.skill==='all'))&&(!f.budget||l.price<=Number(f.budget))).sort((a,b)=>f.sort==='high'?b.price-a.price:a.price-b.price)}
function field(id,label,choices,current){return `<label class="field" for="${id}"><span>${label}</span><select id="${id}" data-filter="${id}">${choices.map(([v,l])=>opt(v,l,current)).join('')}</select></label>`}
function filters(q){const f=readFilters(q),active=['area','age','skill','budget'].filter(k=>f[k]).length;return `<details class="filter-panel glass"${filtersExpanded?' open':''}><summary><span class="summary-left">${svg('filter')}Filters</span><span class="filter-state">${active?active+' active':'Age, budget & level'}</span></summary><div class="filters">${field('area','Area',[['','All areas'],...AREAS[f.emirate].map(a=>[a,a])],f.area)}${field('age','Age group',[['','All ages'],...Object.entries(AGE_LABELS)],f.age)}${field('budget','Budget · AED per session',[['','Any budget'],['30','Up to AED 30'],['50','Up to AED 50'],['75','Up to AED 75'],['100','Up to AED 100']],f.budget)}${field('skill','Skill level',[['','Any level'],...Object.entries(SKILL_LABELS)],f.skill)}<div class="clear-row"><p>Skill filters include sessions open to all levels. “All levels” shows those sessions only.</p><button class="text-btn" data-clear>Clear filters</button></div></div></details>`}
function imageFor(l){return l.sport==='football'?footballPhoto(l.id.split('-').at(-1)):sportPhoto(l.sport)}
function compactAges(ages){if(ages.length===4)return 'All ages';return ages.map(a=>({children:'Children',teenagers:'Teens',adults:'Adults',seniors:'Seniors'}[a])).join(' & ')}
function listingCard(l,q,savedPage=false){return `<article class="result-card glass"><div class="result-image">${imageFor(l)}<span class="sample-badge">Sample</span><button class="save-btn" data-save="${l.id}" aria-pressed="${saved.has(l.id)}" aria-label="${saved.has(l.id)?'Unsave':'Save'} ${esc(l.name)}">${svg('bookmark')}</button></div><div class="result-body">${savedPage?`<p class="category-meta">${SPORTS.find(s=>s.id===l.sport).name} · ${CATEGORIES[l.category].name}</p>`:''}<h2>${esc(l.name)}</h2><p class="result-meta">${svg('pin')}<span>${esc(l.area)} · ${compactAges(l.ages)}${savedPage?' · '+esc(l.emirate):''}</span></p><p class="result-meta">${svg('people')}<span>${SKILL_LABELS[l.skill]}${l.skill==='beginner'?' friendly':''}</span></p><p class="result-description">${l.description}</p><div class="result-price"><div class="price">AED ${l.price}<small>per session · ${l.duration} min</small></div><a class="go" href="${route('/listing/'+l.id,q)}" aria-label="View details for ${esc(l.name)}">${svg('next')}</a></div></div></article>`}
function resultsPage(category,sportId,q){const s=SPORTS.find(s=>s.id===sportId),f=readFilters(q),list=filtered(category,sportId,q);return `<section class="hero results-hero">${heroPhoto(sportId)}<p class="eyebrow">${CATEGORIES[category].name} / ${s.name}</p><h1>${category==='training'?'A place to improve.':'A game to join.'}</h1><p class="subtitle">${s.name} ${category==='training'?'training':'games & clubs'} in ${esc(f.emirate)}</p></section>${filters(q)}<section aria-label="Sample results"><div class="results-toolbar"><span role="status">${list.length} sample ${list.length===1?'place':'places'}</span><label class="sort-label" for="sort"><span class="sr-only">Sort by</span><select class="sort-select" id="sort" data-filter="sort">${opt('low','Price: low to high',f.sort)}${opt('high','Price: high to low',f.sort)}</select></label></div>${list.length?`<div class="results-list">${list.map(l=>listingCard(l,q)).join('')}</div>`:`<div class="empty glass"><h2>No sessions match.</h2><p>Try another area, age group or budget, or clear filters to explore all sessions in ${esc(f.emirate)}.</p><button class="btn" data-clear>Clear filters</button></div>`}</section>${note()}`}
function detailsPage(l,q){const s=SPORTS.find(s=>s.id===l.sport);return `<section class="hero detail-title">${heroPhoto(l.sport)}<p class="eyebrow">Sample listing · ${s.name} · ${CATEGORIES[l.category].name}</p><h1>${esc(l.name)}</h1><p class="subtitle">${esc(l.area)}, ${esc(l.emirate)} · Illustrative location</p></section><aside class="session-price glass" aria-label="Sample session price"><div class="price-header"><div class="price">AED ${l.price}<small>per ${l.duration}-minute session</small></div><button class="btn secondary save-detail" data-save="${l.id}" aria-pressed="${saved.has(l.id)}">${svg('bookmark')}${saved.has(l.id)?'Saved':'Save'}</button></div><p>${l.includes}</p><div class="trial">${l.trial?`Sample trial · AED ${Math.max(15,l.price-15)} for one ${l.duration}-minute session.`:'No trial session in this sample listing.'}</div></aside><div class="detail-content glass"><section class="detail-section"><h2>About this session</h2><p>${l.description}</p><p>${l.extra}</p></section><section class="detail-section"><h2>Who it’s for</h2><dl><dt>Sport</dt><dd>${s.name}</dd><dt>Activity</dt><dd>${CATEGORIES[l.category].name}</dd><dt>Ages</dt><dd>${l.ages.map(a=>AGE_LABELS[a]).join(', ')}</dd><dt>Skill level</dt><dd>${SKILL_LABELS[l.skill]}</dd></dl></section><section class="detail-section"><h2>Sample schedule</h2><p>${l.schedule}<br>${l.duration}-minute sessions · UAE local time</p><p>This schedule is fictional and does not represent live availability.</p></section><section class="detail-section"><h2>Ready for your session</h2><dl><dt>Provided</dt><dd>${l.provided}</dd><dt>Bring</dt><dd>${l.bring}</dd></dl></section><section class="detail-section provider"><h2>Provider details coming later</h2><p>Real contact information and booking options will be added when providers join SportNear. This prototype cannot accept bookings or messages.</p></section></div>${note()}`}
function savedPage(){const list=LISTINGS.filter(l=>saved.has(l.id));return `<section class="hero sports-hero"><p class="eyebrow">Your shortlist</p><h1>Worth coming back to.</h1><p class="subtitle">${list.length} saved sample ${list.length===1?'session':'sessions'}</p></section>${list.length?`<div class="results-list">${list.map(l=>listingCard(l,new URLSearchParams({emirate:l.emirate}),true)).join('')}</div>`:`<div class="empty glass"><h2>Your next sport is waiting.</h2><p>Save a session while exploring and find it here. Your shortlist stays in this browser when local storage is available.</p><a class="btn" href="${route('/sports/'+lastCategory,cityQuery())}">Explore sports</a></div>`}${note()}`}
function announce(message){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=message;toastTimer=setTimeout(()=>{el.textContent=''},2800)}
function render(){const {path,p,q}=state();if(EMIRATES.includes(q.get('emirate')))currentEmirate=q.get('emirate');const focusId=document.activeElement?.id,saveFocus=document.activeElement?.dataset.save,clearFocus=document.activeElement?.matches('[data-clear]');let html,title='Your next move',back=null,active='explore';app.classList.toggle('home',!p.length);if(!p.length){html=home();active='home'}else if(p[0]==='sports'&&CATEGORIES[p[1]]){lastCategory=p[1];html=sportsPage(p[1]);title=CATEGORIES[p[1]].name;back=route('/',cityQuery())}else if(p[0]==='results'&&CATEGORIES[p[1]]&&SPORTS.some(s=>s.id===p[2])){lastCategory=p[1];html=resultsPage(p[1],p[2],q);title=SPORTS.find(s=>s.id===p[2]).name+' · '+CATEGORIES[p[1]].name;back=route('/sports/'+p[1],cityQuery())}else if(p[0]==='listing'){const l=LISTINGS.find(l=>l.id===p[1]);if(l){lastCategory=l.category;html=detailsPage(l,q);title=l.name;back=route('/results/'+l.category+'/'+l.sport,q)}}else if(p[0]==='saved'){html=savedPage();title='Saved sessions';active='saved';back=route('/',cityQuery())}if(!html){html='<section class="empty glass"><h1>Page unavailable.</h1><p>Choose a sport to explore the sample listings.</p><a class="btn" href="#/">Back to home</a></section>';back=route('/',cityQuery())}header(back);main.innerHTML=html;bottom(active);document.title='SportNear — '+title;if(path!==previousPath){window.scrollTo(0,0);if(previousPath)main.focus({preventScroll:true})}else if(focusId){document.getElementById(focusId)?.focus({preventScroll:true})}else if(saveFocus){main.querySelector(`[data-save="${saveFocus}"]`)?.focus({preventScroll:true})}else if(clearFocus){main.querySelector('[data-clear]')?.focus({preventScroll:true})}previousPath=path;}
document.getElementById('topbar').addEventListener('change',event=>{if(event.target.id!=='emirate')return;currentEmirate=event.target.value;const {path,p,q}=state();q.set('emirate',currentEmirate);q.delete('area');if(p[0]==='listing'){const l=LISTINGS.find(l=>l.id===p[1]);nav(l?'/results/'+l.category+'/'+l.sport:'/',q)}else nav(path,q)});
main.addEventListener('change',event=>{const key=event.target.dataset.filter;if(!key)return;const {path,q}=state();q.set('emirate',currentEmirate);event.target.value?q.set(key,event.target.value):q.delete(key);nav(path,q)});
main.addEventListener('toggle',event=>{if(event.target.matches('.filter-panel'))filtersExpanded=event.target.open},true);
main.addEventListener('click',event=>{const clear=event.target.closest('[data-clear]'),save=event.target.closest('[data-save]'),locationButton=event.target.closest('[data-location]');if(clear){const {path}=state();nav(path,cityQuery());announce('Filters cleared.')}else if(save){const id=save.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem('sportnear-saved',JSON.stringify([...saved]))}catch{}render();announce(saved.has(id)?'Added to your saved sessions.':'Removed from saved sessions.')}else if(locationButton){document.getElementById('emirate').focus();try{document.getElementById('emirate').showPicker?.()}catch{}}});
document.querySelector('.skip').addEventListener('click',event=>{event.preventDefault();main.focus()});
window.addEventListener('hashchange',render);render();
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'navigate_sport_sessions',title:'Explore SportNear sessions',description:'Open sample results by sport, category and emirate, with optional age, skill and budget filters. Does not book a session.',inputSchema:{type:'object',properties:{category:{type:'string',enum:['training','play']},sport:{type:'string',enum:SPORTS.map(s=>s.id)},emirate:{type:'string',enum:EMIRATES},age:{type:'string',enum:Object.keys(AGE_LABELS)},skill:{type:'string',enum:Object.keys(SKILL_LABELS)},budget:{type:'string',enum:['30','50','75','100']}},required:['category','sport','emirate'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute(input){if(!input||!CATEGORIES[input.category]||!SPORTS.some(s=>s.id===input.sport)||!EMIRATES.includes(input.emirate)||Object.keys(input).some(k=>!['category','sport','emirate','age','skill','budget'].includes(k))||(input.age&&!Object.hasOwn(AGE_LABELS,input.age))||(input.skill&&!Object.hasOwn(SKILL_LABELS,input.skill))||(input.budget&&!['30','50','75','100'].includes(input.budget)))throw new Error('Invalid discovery filters');const q=new URLSearchParams();for(const k of ['emirate','age','skill','budget'])if(input[k])q.set(k,input[k]);history.pushState(null,'',route('/results/'+input.category+'/'+input.sport,q));render();return {sample:true,count:filtered(input.category,input.sport,q).length}}})).catch(()=>{})}catch{}}

</script>
